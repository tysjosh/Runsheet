name: CI

on:
  # Any base branch, not just main. A stacked pull request targets the branch
  # below it rather than main, so `branches: [main]` meant CI did not run on it
  # at all — every check reported as "skipped" and the PR looked reviewable when
  # nothing had been verified. Silence is the worst possible result here, so the
  # filter is removed rather than extended with a list that the next stack
  # naming convention would fall outside of.
  pull_request:
  push:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  # Kept at 24 to match the npm major that wrote driver-app/package-lock.json,
  # and because GitHub is retiring Node 20 runners.
  #
  # This does NOT fix the driver-app `npm ci` failure, contrary to what this
  # comment previously claimed. The earlier explanation was that Node 20's npm 10
  # auto-installs peer dependencies while npm 11 does not, so npm 10 refused a
  # lock written by npm 11. The evidence contradicts it: the driver-app job has
  # since run on Node v24.18.0 — the same version developers use — and `npm ci`
  # still aborted with the same "Missing: prettier@3.9.6" plus three @emnapi
  # conflicts.
  #
  # The actual cause is platform, not npm major. `@emnapi/*` arrive through a
  # Linux-only optional dependency subtree. macOS npm never evaluates that
  # subtree, so `npm install --package-lock-only` reports "up to date" and writes
  # nothing locally, while `npm ci` on a Linux runner finds the entries absent.
  # The durable fix is a lockfile generated on Linux; until then the driver-app
  # job stays red and no amount of NODE_VERSION tuning changes that.
  NODE_VERSION: "24"
  COVERAGE_THRESHOLD: 70

jobs:
  # -----------------------------------------------------------------
  # Job 1: Secret scan — run scripts/check-secrets.sh on changed files
  # -----------------------------------------------------------------
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        run: |
          chmod +x scripts/check-secrets.sh
          bash scripts/check-secrets.sh

  # -----------------------------------------------------------------
  # Job 2: Backend tests + coverage (70% minimum)
  # -----------------------------------------------------------------
  backend-tests:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: Runsheet-backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: Runsheet-backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests with coverage
        env:
          ELASTICSEARCH_URL: "http://localhost:9200"
          ELASTIC_ENDPOINT: "http://localhost:9200"
          ELASTIC_API_KEY: "mock-key-for-ci"
          ELASTICSEARCH_API_KEY: "mock-key-for-ci"
          REDIS_URL: "redis://localhost:6379"
          JWT_SECRET: "ci-test-jwt-secret"
          JWT_ALGORITHM: "HS256"
          ENVIRONMENT: "test"
        run: |
          pytest --cov=. --cov-report=html:coverage_html --cov-report=xml:coverage.xml \
                 --cov-report=term-missing \
                 --cov-fail-under=${{ env.COVERAGE_THRESHOLD }} \
                 -x -q

      - name: Check changed-file coverage
        run: python scripts/check_coverage.py --threshold 0

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            Runsheet-backend/coverage_html/
            Runsheet-backend/coverage.xml
          retention-days: 14

  # -----------------------------------------------------------------
  # Job 3: Route smoke tests (30-second timeout)
  # -----------------------------------------------------------------
  smoke-tests:
    runs-on: ubuntu-latest
    needs: backend-tests
    defaults:
      run:
        working-directory: Runsheet-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: Runsheet-backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run smoke tests
        env:
          ELASTICSEARCH_URL: "http://localhost:9200"
          ELASTIC_ENDPOINT: "http://localhost:9200"
          ELASTIC_API_KEY: "mock-key-for-ci"
          ELASTICSEARCH_API_KEY: "mock-key-for-ci"
          REDIS_URL: "redis://localhost:6379"
          JWT_SECRET: "ci-test-jwt-secret"
          JWT_ALGORITHM: "HS256"
          ENVIRONMENT: "test"
        run: |
          pytest tests/smoke/ -v --timeout=30

  # -----------------------------------------------------------------
  # Job 4: Integration tests (feature flags, tenant flows, 120s timeout)
  # -----------------------------------------------------------------
  integration-tests:
    runs-on: ubuntu-latest
    needs: backend-tests
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: Runsheet-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: Runsheet-backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run integration tests
        env:
          ELASTICSEARCH_URL: "http://localhost:9200"
          ELASTIC_ENDPOINT: "http://localhost:9200"
          ELASTIC_API_KEY: "mock-key-for-ci"
          ELASTICSEARCH_API_KEY: "mock-key-for-ci"
          REDIS_URL: "redis://localhost:6379"
          JWT_SECRET: "ci-test-jwt-secret"
          JWT_ALGORITHM: "HS256"
          ENVIRONMENT: "test"
        run: |
          pytest tests/integration/ -v --timeout=120

  # -----------------------------------------------------------------
  # Job 5: Endpoint registry freshness — regenerate and diff
  # -----------------------------------------------------------------
  endpoint-registry:
    runs-on: ubuntu-latest
    needs: backend-tests
    defaults:
      run:
        working-directory: Runsheet-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: Runsheet-backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate endpoint registry
        env:
          ELASTICSEARCH_URL: "http://localhost:9200"
          ELASTIC_ENDPOINT: "http://localhost:9200"
          ELASTIC_API_KEY: "mock-key-for-ci"
          ELASTICSEARCH_API_KEY: "mock-key-for-ci"
          REDIS_URL: "redis://localhost:6379"
          JWT_SECRET: "ci-test-jwt-secret"
          JWT_ALGORITHM: "HS256"
          ENVIRONMENT: "test"
        run: python scripts/generate_endpoint_registry.py

      - name: Check registry is up to date
        run: |
          if ! git diff --exit-code ../docs/endpoint-registry.md; then
            echo "❌ Endpoint registry is stale. Run: cd Runsheet-backend && python scripts/generate_endpoint_registry.py"
            exit 1
          fi
          echo "✅ Endpoint registry is up to date."

  # -----------------------------------------------------------------
  # Job 6: Migration freshness — migrations apply cleanly + models in sync
  # -----------------------------------------------------------------
  migration-check:
    runs-on: ubuntu-latest
    needs: backend-tests
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: runsheet
          POSTGRES_PASSWORD: runsheet
          POSTGRES_DB: runsheet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U runsheet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: Runsheet-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: Runsheet-backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply migrations to a fresh database
        env:
          ENVIRONMENT: "development"
          DATABASE_URL: "postgresql+psycopg://runsheet:runsheet@localhost:5432/runsheet"
        run: alembic upgrade head

      - name: Verify DB is at the latest head (drift check)
        env:
          ENVIRONMENT: "development"
          DATABASE_URL: "postgresql+psycopg://runsheet:runsheet@localhost:5432/runsheet"
        run: python -m scripts.check_migrations

      - name: Verify a single linear migration head (no divergent branches)
        env:
          ENVIRONMENT: "development"
          DATABASE_URL: "postgresql+psycopg://runsheet:runsheet@localhost:5432/runsheet"
        run: |
          head_count=$(alembic heads 2>/dev/null | grep -c '(head)')
          echo "Migration heads detected: $head_count"
          if [ "$head_count" -ne 1 ]; then
            echo "❌ Expected exactly one migration head; found $head_count."
            echo "Divergent branches must be merged: alembic merge -m '<msg>' <rev1> <rev2>"
            alembic heads
            exit 1
          fi
          echo "✅ Single linear migration head."

  # -----------------------------------------------------------------
  # Job 7: Git hygiene — no ignored files tracked, ADR index exists
  # -----------------------------------------------------------------
  git-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for generated artifacts in git index
        run: |
          artifacts=$(git ls-files | grep -E '\.coverage$|\.hypothesis/|__pycache__/|\.pyc$' || true)
          if [ -n "$artifacts" ]; then
            echo "❌ Generated artifacts found in git index:"
            echo "$artifacts"
            echo ""
            echo "Remove them with:"
            echo "  git rm --cached <file>"
            echo "  git rm --cached -r <directory>"
            exit 1
          fi
          echo "✅ No generated artifacts in git index."

      - name: Verify no ignored files are tracked
        run: |
          tracked=$(git ls-files -i --exclude-standard 2>/dev/null || true)
          if [ -n "$tracked" ]; then
            echo "❌ Tracked files matching .gitignore patterns:"
            echo "$tracked"
            exit 1
          fi
          echo "✅ No ignored files are tracked."

      - name: Verify ADR index exists
        run: |
          if [ ! -f docs/adr/README.md ]; then
            echo "❌ docs/adr/README.md not found. ADR index is required."
            exit 1
          fi
          echo "✅ ADR index exists."

      - name: Verify main.py line count
        run: |
          # Count non-blank, non-comment, non-import lines
          count=$(grep -cvE '^\s*$|^\s*#|^\s*(import |from )' Runsheet-backend/main.py || true)
          echo "main.py effective line count: $count"
          if [ "$count" -gt 200 ]; then
            echo "❌ main.py exceeds 200 lines ($count lines)"
            exit 1
          fi
          echo "✅ main.py is within the 200-line limit."
