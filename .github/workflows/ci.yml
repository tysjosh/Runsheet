name: CI

on:
  # Any base branch, not just main. A stacked pull request targets the branch
  # below it rather than main, so `branches: [main]` meant CI did not run on it
  # at all — every check reported as "skipped" and the PR looked reviewable when
  # nothing had been verified. Silence is the worst possible result here, so the
  # filter is removed rather than extended with a list that the next stack
  # naming convention would fall outside of.
  pull_request:
  push:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  # Kept at 24 to match the npm major that wrote driver-app/package-lock.json,
  # and because GitHub is retiring Node 20 runners.
  #
  # This does NOT fix the driver-app `npm ci` failure, contrary to what this
  # comment previously claimed. The earlier explanation was that Node 20's npm 10
  # auto-installs peer dependencies while npm 11 does not, so npm 10 refused a
  # lock written by npm 11. The evidence contradicts it: the driver-app job has
  # since run on Node v24.18.0 — the same version developers use — and `npm ci`
  # still aborted with the same "Missing: prettier@3.9.6" plus three @emnapi
  # conflicts.
  #
  # The actual cause was platform, not npm major. `@unrs/resolver-binding-
  # wasm32-wasi` needs `@emnapi` nested at 1.10.0 while the top level needs
  # 2.0.0-alpha.3, and `prettier` (a peer of prettier-plugin-tailwindcss) needs a
  # top-level entry. macOS npm never evaluates that wasm32-wasi binding, so it
  # wrote a single flat `@emnapi` copy and no prettier entry, and answered "up to
  # date" every time it was asked to check — which is why this was invisible
  # locally and reproducible only on a runner.
  #
  # Fixed by regenerating driver-app/package-lock.json inside a linux/amd64
  # container so the resolution includes that subtree. Keep it that way: a lock
  # regenerated on macOS will drop those entries again and break `npm ci`.
  NODE_VERSION: "24"
  COVERAGE_THRESHOLD: 70

jobs:
  # -----------------------------------------------------------------
  # Job 1: Secret scan — run scripts/check-secrets.sh on changed files
  # -----------------------------------------------------------------
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        run: |
          chmod +x scripts/check-secrets.sh
          bash scripts/check-secrets.sh

  # -----------------------------------------------------------------
  # Job 2: Backend tests + coverage (70% minimum)
  # -----------------------------------------------------------------
  backend-tests:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: Runsheet-backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: Runsheet-backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests with coverage
        env:
          # ELASTIC_ENDPOINT / ELASTIC_API_KEY were here because config.settings
          # made them required fields. Both are gone with the cluster.
          REDIS_URL: "redis://localhost:6379"
          JWT_SECRET: "ci-test-jwt-secret"
          JWT_ALGORITHM: "HS256"
          ENVIRONMENT: "test"
        run: |
          pytest --cov=. --cov-report=html:coverage_html --cov-report=xml:coverage.xml \
                 --cov-report=term-missing \
                 --cov-fail-under=${{ env.COVERAGE_THRESHOLD }} \
                 -x -q

      - name: Check changed-file coverage
        run: python scripts/check_coverage.py --threshold 0

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            Runsheet-backend/coverage_html/
            Runsheet-backend/coverage.xml
          retention-days: 14

  # -----------------------------------------------------------------
  # The `smoke-tests` and `integration-tests` jobs stood here. Both are gone.
  #
  # They could never pass. `pytest.ini` puts `--cov=.` and
  # `--cov-config=.coveragerc` in `addopts`, and `.coveragerc` sets
  # `fail_under = 70`. Running a subset therefore measures whole-codebase
  # coverage from that subset: smoke reported 12.96%, integration 15.86%, and
  # both jobs failed the 70% gate with every one of their own tests passing
  # (29 passed, and 339 passed + 4 skipped respectively). No amount of test
  # writing inside those directories could have cleared it.
  #
  # They were also pure duplicates. `pytest.ini` sets `testpaths = tests`, so
  # the bare `pytest` in `backend-tests` already collects `tests/smoke` and
  # `tests/integration` — the same tests ran twice per CI run, the second time
  # after a fresh checkout and a full `pip install`. `integration-tests` even
  # declared the identical `redis` service as `backend-tests`, so it was not a
  # different environment either.
  #
  # Nobody noticed because both declared `needs: backend-tests`, and that job
  # was failing earlier on an undeclared `pypdf` import, so neither ever ran.
  #
  # The one thing they contributed was a per-test timeout (30s and 120s). That
  # is now `--timeout=120` in `pytest.ini`, so the hang guard covers all ~10,600
  # tests rather than the ~370 in those two directories.
  # -----------------------------------------------------------------

  # -----------------------------------------------------------------
  # Endpoint registry freshness — regenerate and diff
  # -----------------------------------------------------------------
  endpoint-registry:
    runs-on: ubuntu-latest
    needs: backend-tests
    defaults:
      run:
        working-directory: Runsheet-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: Runsheet-backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate endpoint registry
        env:
          REDIS_URL: "redis://localhost:6379"
          JWT_SECRET: "ci-test-jwt-secret"
          JWT_ALGORITHM: "HS256"
          ENVIRONMENT: "test"
        run: python scripts/generate_endpoint_registry.py

      - name: Check registry is up to date
        run: |
          if ! git diff --exit-code ../docs/endpoint-registry.md; then
            echo "❌ Endpoint registry is stale. Run: cd Runsheet-backend && python scripts/generate_endpoint_registry.py"
            exit 1
          fi
          echo "✅ Endpoint registry is up to date."

  # -----------------------------------------------------------------
  # Job 6: Migration freshness — migrations apply cleanly + models in sync
  # -----------------------------------------------------------------
  migration-check:
    runs-on: ubuntu-latest
    needs: backend-tests
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: runsheet
          POSTGRES_PASSWORD: runsheet
          POSTGRES_DB: runsheet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U runsheet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    # Job-level so all three alembic steps share it. Every step here imports
    # ``config.settings``, which validates the whole configuration before alembic
    # gets a chance to run.
    #
    # ``ELASTIC_ENDPOINT`` / ``ELASTIC_API_KEY`` used to be here: they were
    # REQUIRED settings fields, and locally they came from the gitignored
    # ``.env.development``, so without placeholders this job died at "Missing
    # required fields: elastic_endpoint, elastic_api_key" before touching a
    # migration. Nobody saw it because the job declares ``needs: backend-tests``,
    # which was failing earlier for an unrelated reason. Both fields are gone from
    # settings now, so the placeholders went with them.
    env:
      ENVIRONMENT: "development"
      DATABASE_URL: "postgresql+psycopg://runsheet:runsheet@localhost:5432/runsheet"
      JWT_SECRET: "ci-test-jwt-secret"
      JWT_ALGORITHM: "HS256"
    defaults:
      run:
        working-directory: Runsheet-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: Runsheet-backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply migrations to a fresh database
        env:
          ENVIRONMENT: "development"
          DATABASE_URL: "postgresql+psycopg://runsheet:runsheet@localhost:5432/runsheet"
        run: alembic upgrade head

      - name: Verify DB is at the latest head (drift check)
        env:
          ENVIRONMENT: "development"
          DATABASE_URL: "postgresql+psycopg://runsheet:runsheet@localhost:5432/runsheet"
        run: python -m scripts.check_migrations

      - name: Verify a single linear migration head (no divergent branches)
        env:
          ENVIRONMENT: "development"
          DATABASE_URL: "postgresql+psycopg://runsheet:runsheet@localhost:5432/runsheet"
        run: |
          head_count=$(alembic heads 2>/dev/null | grep -c '(head)')
          echo "Migration heads detected: $head_count"
          if [ "$head_count" -ne 1 ]; then
            echo "❌ Expected exactly one migration head; found $head_count."
            echo "Divergent branches must be merged: alembic merge -m '<msg>' <rev1> <rev2>"
            alembic heads
            exit 1
          fi
          echo "✅ Single linear migration head."

      # The only reason to have a backup is a restore, and a restore procedure
      # nobody executes is a guess. This runs the real dump → restore → compare
      # cycle against the freshly migrated schema, so the procedure in
      # docs/deploy-runbook.md stays executable rather than aspirational.
      #
      # It reuses this job's database because the schema here is the one that
      # matters: it has been through the whole chain including
      # 0007_drop_shipments_current, the destructive revision the pre-migration
      # snapshot exists to protect against.
      - name: Restore drill — dump, restore to a scratch DB, compare row counts
        env:
          PGPASSWORD: runsheet
        run: |
          # The runner's default client may be older than the server; pg_restore
          # refuses an archive produced by a newer pg_dump, so use the client
          # that matches the postgres:16 service.
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16 || \
            sudo apt-get install -y -qq postgresql-client
          pg_dump --version

          # The migrated database is empty, and a drill over an empty database
          # compares zeros to zeros — it would pass just as happily if
          # pg_restore copied no rows at all. The script refuses that case, so
          # seed rows first. Plain SQL, no app code: the point is to exercise
          # dump/restore fidelity, not the ORM.
          psql "postgresql://runsheet:runsheet@localhost:5432/runsheet" -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO tax_jurisdictions (jurisdiction_id, tenant_id, status, document, created_at, updated_at)
          SELECT 'ci-juris-' || g, 'ci-tenant', 'active',
                 json_build_object('jurisdiction_id', 'ci-juris-' || g, 'tenant_id', 'ci-tenant'),
                 now(), now()
          FROM generate_series(1, 5) AS g;

          INSERT INTO customers (customer_id, tenant_id, display_name, status, external_refs, metadata, created_at, updated_at)
          SELECT 'ci-cust-' || g, 'ci-tenant', 'CI Customer ' || g, 'active',
                 '{}'::json, '{}'::json, now(), now()
          FROM generate_series(1, 3) AS g;
          SQL

          chmod +x scripts/backup_restore.sh
          bash scripts/backup_restore.sh drill \
            "postgresql://runsheet:runsheet@localhost:5432/runsheet" \
            runsheet_ci_drill

      # The Postgres document store translates the Elasticsearch query DSL to
      # SQL over a jsonb column. That translation rests entirely on jsonb
      # operators — containment (@>), key existence (?), jsonb's total ordering
      # for sort — none of which SQLite has, so the main backend-tests job (which
      # runs against in-memory SQLite) CANNOT cover it. Its fixtures skip without
      # a server, which is the honest behaviour but means the tests would never
      # run anywhere if this step did not exist.
      #
      # This job is the right home: it already has a postgres:16 service and has
      # already applied the full migration chain, so es_documents exists with its
      # GIN index. Placed after the restore drill so a schema problem is reported
      # by the cheaper check first.
      - name: Document store — query translation and store behaviour
        env:
          # ENVIRONMENT=test, overriding this job's development default. It was
          # originally needed because ``ElasticsearchService.connect()`` raised on a
          # failed ping outside the test environment and this job had no
          # Elasticsearch service, so importing tests/conftest.py failed before a
          # single test ran. ``connect()`` cannot fail any more — there is no
          # cluster to ping — but the tests are written for the test environment
          # and this is where the rest of the suite runs them.
          ENVIRONMENT: "test"
          # Required by settings validation in a non-development environment when
          # session_store_type is redis (the default). Never dialled: no test here
          # opens a session.
          REDIS_URL: "redis://localhost:6379/0"
          DATABASE_URL: "postgresql+psycopg://runsheet:runsheet@localhost:5432/runsheet"
          POSTGRES_TEST_URL: "postgresql+psycopg://runsheet:runsheet@localhost:5432/runsheet"
        working-directory: Runsheet-backend
        run: |
          # -p no:cacheprovider keeps the hypothesis example database out of the
          # workspace, which the git-hygiene job would otherwise flag.
          python -m pytest tests/postgres -q --no-cov -p no:cacheprovider \
            | tee /tmp/docstore.log

          # pytest exits 0 when every test SKIPS, and these tests skip without a
          # reachable server. A green step that ran nothing is precisely the
          # outcome the fixtures were written to avoid, so require passes and
          # forbid skips explicitly.
          if ! grep -qE '[0-9]+ passed' /tmp/docstore.log; then
            echo "❌ No document-store tests passed — they were skipped or not collected."
            echo "   The Postgres service or POSTGRES_TEST_URL is not reachable."
            exit 1
          fi
          if grep -qE '[0-9]+ skipped' /tmp/docstore.log; then
            echo "❌ Some document-store tests skipped; every one of them needs the database."
            exit 1
          fi
          echo "✅ Document-store tests ran against PostgreSQL."

  # -----------------------------------------------------------------
  # Job 7: Git hygiene — no ignored files tracked, ADR index exists
  # -----------------------------------------------------------------
  git-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for generated artifacts in git index
        run: |
          artifacts=$(git ls-files | grep -E '\.coverage$|\.hypothesis/|__pycache__/|\.pyc$' || true)
          if [ -n "$artifacts" ]; then
            echo "❌ Generated artifacts found in git index:"
            echo "$artifacts"
            echo ""
            echo "Remove them with:"
            echo "  git rm --cached <file>"
            echo "  git rm --cached -r <directory>"
            exit 1
          fi
          echo "✅ No generated artifacts in git index."

      - name: Verify no ignored files are tracked
        run: |
          tracked=$(git ls-files -i --exclude-standard 2>/dev/null || true)
          if [ -n "$tracked" ]; then
            echo "❌ Tracked files matching .gitignore patterns:"
            echo "$tracked"
            exit 1
          fi
          echo "✅ No ignored files are tracked."

      - name: Verify ADR index exists
        run: |
          if [ ! -f docs/adr/README.md ]; then
            echo "❌ docs/adr/README.md not found. ADR index is required."
            exit 1
          fi
          echo "✅ ADR index exists."

      - name: Verify main.py line count
        run: |
          # Count non-blank, non-comment, non-import lines
          count=$(grep -cvE '^\s*$|^\s*#|^\s*(import |from )' Runsheet-backend/main.py || true)
          echo "main.py effective line count: $count"
          if [ "$count" -gt 200 ]; then
            echo "❌ main.py exceeds 200 lines ($count lines)"
            exit 1
          fi
          echo "✅ main.py is within the 200-line limit."
  # -----------------------------------------------------------------
  # Job 8: Driver app (/driver-app) — donor-value guard, types, lint, tests
  # The repository's first frontend job. No `needs:`, so it runs alongside
  # the seven Python jobs above rather than behind them.
  # -----------------------------------------------------------------
  driver-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: driver-app
    steps:
      - uses: actions/checkout@v4

      # Runs before any install or build step: none of the four donor build
      # credentials may survive into /driver-app, and the iOS bundle identifier
      # and Android application id are immutable once published to a store.
      - name: Guard against donor build credentials
        working-directory: .
        run: |
          chmod +x scripts/check-donor-values.sh
          bash scripts/check-donor-values.sh driver-app

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: driver-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript compilation check
        run: npm run check-types

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test -- --ci

  # -----------------------------------------------------------------
  # Job 9: Backend image — build it, then prove it starts
  # A Dockerfile that is never built rots quietly: the first time anyone needs
  # it is a deploy, which is the worst moment to discover a dependency has no
  # wheel for linux/amd64. Building on every PR keeps the deploy artifact
  # honest. No `needs:` — this is independent of the test jobs.
  # -----------------------------------------------------------------
  docker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the runtime image
        uses: docker/build-push-action@v6
        with:
          context: Runsheet-backend
          platforms: linux/amd64
          push: false
          load: true
          tags: runsheet-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Refuse to ship credentials or a host virtualenv
        run: |
          # .dockerignore excludes every .env.* except the placeholder template.
          # A real env file in a layer is readable by anyone who can pull the
          # image, and a copied-in venv would both bloat the image and shadow
          # /opt/venv with host-platform binaries.
          leaked=$(docker run --rm --entrypoint sh runsheet-backend:ci -c \
            'ls -a /app | grep "^\.env" | grep -v "^\.env\.example$" || true')
          if [ -n "$leaked" ]; then
            echo "❌ Environment files present in the image:"
            echo "$leaked"
            exit 1
          fi
          for path in venv .venv .git tests; do
            if docker run --rm --entrypoint sh runsheet-backend:ci -c "[ -e /app/$path ]"; then
              echo "❌ /app/$path was copied into the image"
              exit 1
            fi
          done
          echo "✅ No credentials, virtualenv, git history or tests in the image."

      - name: Refuse to run as root
        run: |
          uid=$(docker run --rm --entrypoint id runsheet-backend:ci -u)
          if [ "$uid" = "0" ]; then
            echo "❌ Image runs as root (uid 0)"
            exit 1
          fi
          echo "✅ Image runs as uid $uid."

      - name: Start the image and wait for readiness
        run: |
          # PostgreSQL is the only dependency /health/ready checks, so that is the
          # only one this job stands up. It used to be Elasticsearch, which was the
          # readiness dependency until the document plane moved: the probe now runs
          # SELECT 1 through the same engine the document store uses. Redis is
          # exercised by backend-tests; what is being proved here is that the IMAGE
          # boots — imports resolve, the venv is intact, uvicorn binds.
          docker network create ci-net
          docker run -d --name pg --network ci-net \
            -e POSTGRES_USER=runsheet \
            -e POSTGRES_PASSWORD=runsheet \
            -e POSTGRES_DB=runsheet \
            postgres:16-alpine

          for i in $(seq 1 60); do
            if docker exec pg pg_isready -U runsheet -d runsheet >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done

          # Schema first, in a one-shot container, exactly as the deploy runbook
          # orders it. The app image deliberately does not migrate on start.
          docker run --rm --network ci-net \
            -e ENVIRONMENT=development \
            -e DATABASE_URL=postgresql+psycopg://runsheet:runsheet@pg:5432/runsheet \
            -e JWT_SECRET=ci-test-jwt-secret \
            --entrypoint alembic runsheet-backend:ci upgrade head

          docker run -d --name app --network ci-net -p 8080:8080 \
            -e ENVIRONMENT=development \
            -e DATABASE_URL=postgresql+psycopg://runsheet:runsheet@pg:5432/runsheet \
            -e GEMINI_API_KEY=ci-placeholder \
            -e SESSION_STORE_TYPE=redis \
            -e REDIS_URL=redis://localhost:6379 \
            -e SUPERTOKENS_CONNECTION_URI=http://supertokens.invalid:3567 \
            -e SUPERTOKENS_API_KEY=ci-placeholder \
            -e LOG_LEVEL=WARNING \
            runsheet-backend:ci

          ready=0
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -m 5 -w '%{http_code}' \
              http://127.0.0.1:8080/health/ready || true)
            if [ "$code" = "200" ]; then ready=1; echo "ready after ${i}s"; break; fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            echo "❌ Image did not become ready. Container logs:"
            docker logs app 2>&1 | tail -60
            exit 1
          fi

      - name: Verify auth is enforced
        run: |
          # A 200 here would mean the tenant guard is not enforcing — the single
          # most consequential thing that can be wrong about a running image.
          code=$(curl -s -o /dev/null -m 10 -w '%{http_code}' \
            http://127.0.0.1:8080/api/orders || true)
          echo "/api/orders -> $code"
          if [ "$code" != "401" ] && [ "$code" != "403" ]; then
            echo "❌ Expected 401/403 without a session, got $code"
            docker logs app 2>&1 | tail -40
            exit 1
          fi
          echo "✅ Unauthenticated reads are rejected."

      - name: Container logs
        if: always()
        run: docker logs app 2>&1 | tail -60 || true

  # -----------------------------------------------------------------
  # Job 10: Dispatcher UI (/runsheet) — types, lint, tests, production build
  # This is the primary operator surface and had NO CI at all: no typecheck,
  # no build, no tests, no lint. All four passed when first run by hand, so
  # this is not about a broken app — it is about an unguarded one. A regression
  # in the UI shipped silently.
  #
  # `next build` is included and not just `tsc`: the build runs type checking
  # across the app router, resolves server/client component boundaries, and
  # prerenders 39 static pages. tsc alone catches none of those failures.
  # -----------------------------------------------------------------
  dispatcher-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runsheet
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: runsheet/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript compilation check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test -- --ci

      - name: Production build
        env:
          # Every value the build reads is NEXT_PUBLIC_* and therefore baked
          # into the bundle. These are build-time placeholders so the build is
          # self-contained: it must not need a reachable backend, and a real
          # key must never be committed to a workflow file.
          NEXT_PUBLIC_API_URL: http://localhost:8080/api
          NEXT_PUBLIC_WS_URL: ws://localhost:8080
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_ST_API_DOMAIN: http://localhost:8080
          NEXT_PUBLIC_ST_WEBSITE_DOMAIN: http://localhost:3000
        run: npm run build
