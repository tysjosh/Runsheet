# Alembic configuration for the PostgreSQL source-of-truth (persistence/).
#
# The database URL is NOT hardcoded here — env.py reads it from the app
# settings (settings.database_url) so migrations and the runtime engine can
# never diverge. Run migrations with:
#   ENVIRONMENT=production ./venv/bin/alembic upgrade head
[alembic]
script_location = alembic
prepend_sys_path = .
# Use OS path separators and a timestamped, slugged filename for new revisions.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
