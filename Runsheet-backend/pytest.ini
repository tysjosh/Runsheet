[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async support
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Coverage settings
addopts = 
    --cov=.
    --cov-report=term-missing
    --cov-report=html:coverage_html
    --cov-config=.coveragerc
    -v
    --tb=short
    # Per-test hang guard for the whole suite. Previously only the tests under
    # tests/smoke and tests/integration got one, via --timeout on their own CI
    # jobs; those jobs are gone (they re-ran a subset the main run already
    # covers and could never pass the global coverage gate), so the guard moves
    # here and now applies to all ~10,600 tests instead of ~370.
    #
    # 120s against a slowest observed test of 8.0s. Deliberately loose: this
    # exists to catch a test that hangs forever, not to police speed. A tight
    # budget here would fail on a loaded CI runner and teach people to raise it.
    --timeout=120

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    property: Property-based tests
    smoke: Route smoke tests
    slow: Slow running tests

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
